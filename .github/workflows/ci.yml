name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes the runs already in flight for the same ref, so cancel
# them instead of letting them finish for a commit nobody cares about anymore.
# Runs on main are never cancelled: every commit that lands there keeps its
# full verification.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Decides whether the rest of the pipeline has anything to do. A change that
  # only touches documentation cannot break a lint, a test or a build, so
  # running them costs minutes of CI for no signal.
  #
  # This gates each job with `if:` rather than putting `paths-ignore` on the
  # workflow trigger. With `paths-ignore` the workflow never starts, so its
  # checks never report at all — and the moment anyone marks one of them
  # required in branch protection, every docs-only PR becomes unmergeable while
  # waiting for a check that will never arrive. A job skipped by `if:` still
  # reports, and counts as passing.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            FILES=$(git diff --name-only "origin/$BASE_REF...HEAD")
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            FILES=$(git diff --name-only "$BEFORE" "$SHA")
          else
            # First push of a branch, a force-push, or anything else we cannot
            # diff: fall through to running everything rather than guessing.
            FILES=""
          fi

          if [ -z "$FILES" ]; then
            echo "Could not determine the changed files — running the full pipeline."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$FILES"

          # Anything that is not documentation counts as code. Listing what is
          # safe to ignore (rather than what is code) keeps the failure mode on
          # the right side: a path nobody thought about runs the full pipeline.
          if echo "$FILES" | grep -qvE '(\.md$|^LICENSE$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation-only change — skipping lint, tests and build."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint-go:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create dummy frontend/dist for go:embed
        run: mkdir -p frontend/dist && echo "<!doctype html><html></html>" > frontend/dist/index.html
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Floating '1.26' resolves to the latest 1.26.x in the actions/go-versions
          # manifest (1.26.10): 1.26.9 / 1.26.10 carry the stdlib fixes for
          # GO-2026-6617 / GO-2026-6613 / GO-2026-6612 / GO-2026-6809 and the earlier
          # GO-2026-6218 / GO-2026-6090 / GO-2026-5972 (fixed in go1.25.13). Staying on
          # the 1.26 line for now: golangci-lint v2.12.2 (built with go1.26) panics on
          # go1.27 export data. Move to '1.27' once a go1.27-compatible linter ships.
          go-version: '1.26'
          check-latest: true
      - run: go vet ./...
      # golangci-lint v2 requires golangci-lint-action v7+. Pinned to a full
      # commit SHA (not a mutable tag) for supply-chain integrity; see
      # .golangci.yml for the linter config.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  vuln-go:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create dummy frontend/dist for go:embed
        run: mkdir -p frontend/dist && echo "<!doctype html><html></html>" > frontend/dist/index.html
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Floating '1.26' resolves to the latest 1.26.x in the actions/go-versions
          # manifest (1.26.10): 1.26.9 / 1.26.10 carry the stdlib fixes for
          # GO-2026-6617 / GO-2026-6613 / GO-2026-6612 / GO-2026-6809 and the earlier
          # GO-2026-6218 / GO-2026-6090 / GO-2026-5972 (fixed in go1.25.13). Staying on
          # the 1.26 line for now: golangci-lint v2.12.2 (built with go1.26) panics on
          # go1.27 export data. Move to '1.27' once a go1.27-compatible linter ships.
          go-version: '1.26'
          check-latest: true
      - name: Scan for known Go vulnerabilities
        # Pinned to a full commit SHA (not a mutable tag) for supply-chain
        # integrity; this is govulncheck v1.6.0.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@19b0bb6a272792b9afa8a6983c3e9b9a1816947f
          govulncheck ./...

  lint-frontend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      # Fail on high/critical advisories; dev-only moderate ones don't block.
      - run: npm audit --audit-level=high
        working-directory: frontend

  test-go:
    needs: [changes, lint-go]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create dummy frontend/dist for go:embed
        run: mkdir -p frontend/dist && echo "<!doctype html><html></html>" > frontend/dist/index.html
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Floating '1.26' resolves to the latest 1.26.x in the actions/go-versions
          # manifest (1.26.10): 1.26.9 / 1.26.10 carry the stdlib fixes for
          # GO-2026-6617 / GO-2026-6613 / GO-2026-6612 / GO-2026-6809 and the earlier
          # GO-2026-6218 / GO-2026-6090 / GO-2026-5972 (fixed in go1.25.13). Staying on
          # the 1.26 line for now: golangci-lint v2.12.2 (built with go1.26) panics on
          # go1.27 export data. Move to '1.27' once a go1.27-compatible linter ships.
          go-version: '1.26'
          check-latest: true
      - run: go test $(go list ./internal/...) -race -coverprofile=coverage.out -covermode=atomic -coverpkg=./internal/...
      - name: Check Go coverage >= 80%
        run: |
          COV=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COV}%"
          if (( $(echo "$COV < 80" | bc -l) )); then
            echo "Coverage ${COV}% is below 80% threshold"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: go-coverage
          path: coverage.out

  test-frontend:
    needs: [changes, lint-frontend]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run test:coverage
        working-directory: frontend
      - name: Check frontend coverage >= 80%
        run: |
          COV=$(node -e "const r=require('./frontend/coverage/coverage-summary.json');console.log(r.total.lines.pct)")
          echo "Total line coverage: ${COV}%"
          if (( $(echo "$COV < 80" | bc -l) )); then
            echo "Coverage ${COV}% is below 80% threshold"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage

  build:
    needs: [changes, test-go, test-frontend]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # No GTK/WebKit system dependencies are needed anymore: the app is a plain
    # Go binary that serves the built frontend to a browser, so it links
    # without any CGo platform libraries.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Floating '1.26' resolves to the latest 1.26.x in the actions/go-versions
          # manifest (1.26.10): 1.26.9 / 1.26.10 carry the stdlib fixes for
          # GO-2026-6617 / GO-2026-6613 / GO-2026-6612 / GO-2026-6809 and the earlier
          # GO-2026-6218 / GO-2026-6090 / GO-2026-5972 (fixed in go1.25.13). Staying on
          # the 1.26 line for now: golangci-lint v2.12.2 (built with go1.26) panics on
          # go1.27 export data. Move to '1.27' once a go1.27-compatible linter ships.
          go-version: '1.26'
          check-latest: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: |
          cd frontend && npm ci --ignore-scripts && npm run build && cd ..
      - name: Build binary
        # go:embed picks up frontend/dist (built above) and embeds it into
        # the binary; the app serves it over plain HTTP.
        run: go build -o build/bin/silly-sleeve .
      - name: Verify binary exists
        run: |
          ls -la build/bin/silly-sleeve || ls -la build/bin/
