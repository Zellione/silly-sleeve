name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes the runs already in flight for the same ref, so cancel
# them instead of letting them finish for a commit nobody cares about anymore.
# Runs on main are never cancelled: every commit that lands there keeps its
# full verification.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Decides whether the rest of the pipeline has anything to do. A change that
  # only touches documentation cannot break a lint, a test or a build, so
  # running them costs minutes of CI for no signal.
  #
  # This gates each job with `if:` rather than putting `paths-ignore` on the
  # workflow trigger. With `paths-ignore` the workflow never starts, so its
  # checks never report at all — and the moment anyone marks one of them
  # required in branch protection, every docs-only PR becomes unmergeable while
  # waiting for a check that will never arrive. A job skipped by `if:` still
  # reports, and counts as passing.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            FILES=$(git diff --name-only "origin/$BASE_REF...HEAD")
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            FILES=$(git diff --name-only "$BEFORE" "$SHA")
          else
            # First push of a branch, a force-push, or anything else we cannot
            # diff: fall through to running everything rather than guessing.
            FILES=""
          fi

          if [ -z "$FILES" ]; then
            echo "Could not determine the changed files — running the full pipeline."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$FILES"

          # Anything that is not documentation counts as code. Listing what is
          # safe to ignore (rather than what is code) keeps the failure mode on
          # the right side: a path nobody thought about runs the full pipeline.
          if echo "$FILES" | grep -qvE '(\.md$|^LICENSE$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation-only change — skipping lint, tests and build."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint-go:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create dummy frontend/dist for go:embed
        run: mkdir -p frontend/dist && echo "<!doctype html><html></html>" > frontend/dist/index.html
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Temporarily pinned to an exact patch: go1.25.13 carries the fixes for
          # GO-2026-6218 / GO-2026-6090 / GO-2026-5972 and is not yet in the
          # actions/go-versions manifest, so setup-go direct-downloads it.
          # Revert to '1.25' once the manifest ships 1.25.13 (check-latest picks it up).
          go-version: '1.25.13'
          check-latest: true
      - run: go vet ./...
      # golangci-lint v2 requires golangci-lint-action v7+. Pinned to a full
      # commit SHA (not a mutable tag) for supply-chain integrity; see
      # .golangci.yml for the linter config.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  vuln-go:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create dummy frontend/dist for go:embed
        run: mkdir -p frontend/dist && echo "<!doctype html><html></html>" > frontend/dist/index.html
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Temporarily pinned to an exact patch: go1.25.13 carries the fixes for
          # GO-2026-6218 / GO-2026-6090 / GO-2026-5972 and is not yet in the
          # actions/go-versions manifest, so setup-go direct-downloads it.
          # Revert to '1.25' once the manifest ships 1.25.13 (check-latest picks it up).
          go-version: '1.25.13'
          check-latest: true
      - name: Scan for known Go vulnerabilities
        # Pinned to a full commit SHA (not a mutable tag) for supply-chain
        # integrity; this is govulncheck v1.6.0.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@19b0bb6a272792b9afa8a6983c3e9b9a1816947f
          govulncheck ./...

  lint-frontend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # frontend/wailsjs/runtime is Wails-generated and gitignored; regenerate
      # it (and go:embed's dummy target) before touching the frontend so its
      # imports resolve, same as the build job further down.
      - name: Create dummy frontend/dist for go:embed
        run: mkdir -p frontend/dist && echo "<!doctype html><html></html>" > frontend/dist/index.html
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Temporarily pinned to an exact patch: go1.25.13 carries the fixes for
          # GO-2026-6218 / GO-2026-6090 / GO-2026-5972 and is not yet in the
          # actions/go-versions manifest, so setup-go direct-downloads it.
          # Revert to '1.25' once the manifest ships 1.25.13 (check-latest picks it up).
          go-version: '1.25.13'
          check-latest: true
      - name: Install Wails CLI
        # Pinned to a full commit SHA (not a mutable tag) for supply-chain
        # integrity; this is wails v2.14.0.
        run: go install github.com/wailsapp/wails/v2/cmd/wails@857398f61118eae7a6d9f5f18ffdd391590703e3
      - name: Generate wailsjs bindings
        run: wails generate module
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      # Fail on high/critical advisories; dev-only moderate ones don't block.
      - run: npm audit --audit-level=high
        working-directory: frontend

  test-go:
    needs: [changes, lint-go]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create dummy frontend/dist for go:embed
        run: mkdir -p frontend/dist && echo "<!doctype html><html></html>" > frontend/dist/index.html
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Temporarily pinned to an exact patch: go1.25.13 carries the fixes for
          # GO-2026-6218 / GO-2026-6090 / GO-2026-5972 and is not yet in the
          # actions/go-versions manifest, so setup-go direct-downloads it.
          # Revert to '1.25' once the manifest ships 1.25.13 (check-latest picks it up).
          go-version: '1.25.13'
          check-latest: true
      - run: go test $(go list ./internal/...) -race -coverprofile=coverage.out -covermode=atomic -coverpkg=./internal/...
      - name: Check Go coverage >= 80%
        run: |
          COV=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COV}%"
          if (( $(echo "$COV < 80" | bc -l) )); then
            echo "Coverage ${COV}% is below 80% threshold"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: go-coverage
          path: coverage.out

  test-frontend:
    needs: [changes, lint-frontend]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create dummy frontend/dist for go:embed
        run: mkdir -p frontend/dist && echo "<!doctype html><html></html>" > frontend/dist/index.html
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Temporarily pinned to an exact patch: go1.25.13 carries the fixes for
          # GO-2026-6218 / GO-2026-6090 / GO-2026-5972 and is not yet in the
          # actions/go-versions manifest, so setup-go direct-downloads it.
          # Revert to '1.25' once the manifest ships 1.25.13 (check-latest picks it up).
          go-version: '1.25.13'
          check-latest: true
      - name: Install Wails CLI
        # Pinned to a full commit SHA (not a mutable tag) for supply-chain
        # integrity; this is wails v2.14.0.
        run: go install github.com/wailsapp/wails/v2/cmd/wails@857398f61118eae7a6d9f5f18ffdd391590703e3
      - name: Generate wailsjs bindings
        run: wails generate module
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run test:coverage
        working-directory: frontend
      - name: Check frontend coverage >= 80%
        run: |
          COV=$(node -e "const r=require('./frontend/coverage/coverage-summary.json');console.log(r.total.lines.pct)")
          echo "Total line coverage: ${COV}%"
          if (( $(echo "$COV < 80" | bc -l) )); then
            echo "Coverage ${COV}% is below 80% threshold"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage

  build:
    needs: [changes, test-go, test-frontend]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # The whole job takes ~10 minutes when the runners are healthy, and ~25
    # when the apt mirrors are degraded (observed 2026-08-18: the system
    # dependency install alone crawled to 15+ minutes). Without a ceiling a
    # genuinely wedged install occupies a runner for the 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Temporarily pinned to an exact patch: go1.25.13 carries the fixes for
          # GO-2026-6218 / GO-2026-6090 / GO-2026-5972 and is not yet in the
          # actions/go-versions manifest, so setup-go direct-downloads it.
          # Revert to '1.25' once the manifest ships 1.25.13 (check-latest picks it up).
          go-version: '1.25.13'
          check-latest: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install system dependencies
        # DEBIAN_FRONTEND must sit after sudo (sudo resets the environment) so
        # a future debconf prompt can never hang the job until the timeout.
        # --no-install-recommends trims the download when the azure apt mirror
        # is degraded (recurring; see the timeout comment above), and
        # Acquire::Retries rides out transient mirror failures.
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 \
            install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails CLI
        # Pinned to a full commit SHA (not a mutable tag) for supply-chain
        # integrity; this is wails v2.14.0.
        run: go install github.com/wailsapp/wails/v2/cmd/wails@857398f61118eae7a6d9f5f18ffdd391590703e3
      # frontend/wailsjs/runtime is Wails-generated and gitignored; the
      # "Build frontend" step below runs tsc directly (not through `wails
      # build`), so its imports need the bindings regenerated first. A
      # temporary go:embed target unblocks generation before the real one
      # lands from "Build frontend"'s own `vite build` output.
      - name: Create dummy frontend/dist for go:embed
        run: mkdir -p frontend/dist && echo "<!doctype html><html></html>" > frontend/dist/index.html
      - name: Generate wailsjs bindings
        run: wails generate module
      - name: Build frontend
        run: |
          cd frontend && npm ci --ignore-scripts && npm run build && cd ..
      - name: Build native binary
        run: wails build -clean -tags webkit2_41
      - name: Verify binary exists
        run: |
          ls -la build/bin/silly-sleeve* || ls -la build/bin/
